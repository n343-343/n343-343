name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v1.0.0)'
        required: true

jobs:
  build_and_release:
    runs-on: windows-latest # Use a Windows runner to build the .exe
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ruinnakbe/requirements.txt
        pip install pyinstaller

    - name: Build Windows executable
      run: |
        cd ruinnakbe
        pyinstaller --onefile --add-data "templates;templates" main.py

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        release_name: Release ${{ github.event.inputs.version }}
        body: |
          # New Release

          This release includes the following changes:

          - (CHANGES GO HERE)

          You can download the Windows executable (`main.exe`) and the source code below.
        draft: false
        prerelease: false

    - name: Upload Release Asset (Executable)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./ruinnakbe/dist/main.exe # Path for the executable on Windows
        asset_name: main.exe
        asset_content_type: application/vnd.microsoft.portable-executable
